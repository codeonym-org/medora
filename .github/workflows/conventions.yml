name: conventions
on:
  pull_request:
permissions:
  contents: read
jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check <type>/<issue>-<slug>
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check_branch_name.py "$BRANCH"
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Every commit in the PR is a conventional commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uvx --from commitizen==4.19.2 cz check --rev-range "$BASE..$HEAD"
